[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twinlink-cli"
version = "2.0.0a1"
description = "Revisioned two-host transport profiles and forwarding management for Linux"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
twinlink = "twinlink.cli:main"

[tool.setuptools]
packages = ["twinlink"]
